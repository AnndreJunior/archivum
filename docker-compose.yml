services:
  db:
    image: postgres:16-alpine
    container_name: archivum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-archivum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archivum}
      POSTGRES_DB: ${DB_DATABASE:-archivum}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-archivum} -d ${DB_DATABASE:-archivum}']
      interval: 10s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: archivum-smtp4dev
    restart: unless-stopped
    ports:
      - '5000:80'
      - '2525:25'

  app:
    build: .
    container_name: archivum-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      ADMIN_NOME: ${ADMIN_NOME}
      ADMIN_MATRICULA: ${ADMIN_MATRICULA}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Archivum}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@archivum.local}
      SMTP_HOST: smtp4dev
      SMTP_PORT: 25
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-archivum}
      DB_PASSWORD: ${DB_PASSWORD:-archivum}
      DB_DATABASE: ${DB_DATABASE:-archivum}
    ports:
      - '${APP_PORT:-3333}:3333'
    command: sh -c "node ace migration:run --force && node bin/server.js"

volumes:
  db-data:
