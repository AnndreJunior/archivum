services:
  db:
    image: postgres:16-alpine
    container_name: archivum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-archivum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archivum}
      POSTGRES_DB: ${DB_DATABASE:-archivum}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-archivum} -d ${DB_DATABASE:-archivum}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
