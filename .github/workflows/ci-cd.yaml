name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Evita dois deploys simultâneos para o mesmo ambiente sem cancelar PRs em andamento.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI - Qualidade e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      TZ: UTC
      HOST: localhost
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ci-only-archivum-app-key-0123456
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      ADMIN_NOME: Administrador do Sistema
      ADMIN_MATRICULA: ADM001
      ADMIN_EMAIL: admin@archivum.test
      ADMIN_SENHA: admin-test-123
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: archivum
      DB_PASSWORD: archivum
      DB_DATABASE: archivum_test
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: Archivum
      MAIL_FROM_ADDRESS: noreply@archivum.test
      SMTP_HOST: localhost
      SMTP_PORT: 2525

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npx --no-install prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Testes
        run: npm test
        env:
          NODE_ENV: test

  migrations:
    name: CD - Aplicar migrations
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    # As variáveis de banco vêm dos secrets do repositório. As demais são apenas
    # valores de preenchimento para a validação de env do AdonisJS durante o CLI;
    # nenhuma delas é usada pelas migrations.
    env:
      NODE_ENV: production
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: cd-only-archivum-app-key-0123456789
      APP_URL: https://archivum.local
      SESSION_DRIVER: cookie
      ADMIN_NOME: Administrador do Sistema
      ADMIN_MATRICULA: ADM001
      ADMIN_EMAIL: admin@archivum.local
      ADMIN_SENHA: cd-only-admin-password
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: Archivum
      MAIL_FROM_ADDRESS: noreply@archivum.local
      SMTP_HOST: localhost
      SMTP_PORT: 2525

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar somente migrations pendentes
        run: |
          if node ace migration:status | grep -q "pending"; then
            echo "Migrations pendentes encontradas. Aplicando..."
            node ace migration:run --force
          else
            echo "Nenhuma migration pendente."
          fi

  docker:
    name: CD - Publicar imagem Docker
    runs-on: ubuntu-latest
    needs: [migrations]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/archivum:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/archivum:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD - Deploy no Render
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 10

    steps:
      - name: Disparar deploy no Render
        run: |
          curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy disparado no Render."
